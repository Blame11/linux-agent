[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-ai-agent"
version = "0.1.0"
description = "Linux Bash AI terminal agent"
requires-python = ">=3.14"
license = "MPL-2.0"
authors = [
    { name = "Tushar Kand" },
]
dependencies = [
    "groq==1.7.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
ai = "backend.cli:ai"
ai-context = "backend.cli:ai_context"

[tool.setuptools]
packages = ["backend"]
